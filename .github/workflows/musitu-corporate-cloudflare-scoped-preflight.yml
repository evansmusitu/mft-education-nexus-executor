name: MUSITU Corporate Pages and DNS Token Preflight (No Writes)

on:
  push:
    branches: [ops/corporate-cf-token-readonly-20261106]

permissions:
  contents: read

jobs:
  read-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Verify existing scoped Cloudflare token without logging its value
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,json,os
          token=os.environ.get('CF_TOKEN','')
          aid=os.environ.get('CF_ACCOUNT_ID','')
          print('Scoped Cloudflare token secret present:',bool(token))
          print('Scoped Cloudflare account secret present:',bool(aid))
          if not token:raise SystemExit(0)
          headers={'Authorization':'Bearer '+token,'Accept':'application/json','User-Agent':'MUSITU-Corporate-Scoped-Preflight/1.0'}
          def get(label,path):
            req=urllib.request.Request('https://api.cloudflare.com/client/v4'+path,method='GET',headers=headers)
            try:
              with urllib.request.urlopen(req,timeout=20) as r:
                d=json.loads(r.read(250000))
                status=r.status
            except urllib.error.HTTPError as e:
              status=e.code
              try:d=json.loads(e.read(250000))
              except Exception:d={}
            except Exception as e:
              print(label,'network_error',type(e).__name__)
              return None
            print(label,'http',status,'success',bool(d.get('success')),'error_codes',[str(x.get('code')) for x in d.get('errors',[])][:3])
            return d.get('result') if status==200 and d.get('success') else None
          verify=get('token_verify','/user/tokens/verify')
          print('token_status_active',bool(verify and verify.get('status')=='active'))
          account='93f395f5121954671f92fffa453d6b61'
          print('known_account_id_match',aid==account)
          projects=get('pages_projects','/accounts/'+account+'/pages/projects?per_page=100')
          if projects is not None:
            found=[p for p in projects if p.get('name')=='musitu-corporate']
            print('corporate_project_found',len(found)==1)
            if len(found)==1:
              print('corporate_project_production_branch',found[0].get('production_branch'))
              print('corporate_project_custom_domain',any(x=='mftintelligence.com' for x in found[0].get('domains',[])))
              deployments=get('pages_deployments','/accounts/'+account+'/pages/projects/musitu-corporate/deployments?per_page=5')
              if deployments is not None:print('rollback_history_count',len(deployments))
          zones=get('zones','/zones?name=mftintelligence.com&per_page=10')
          if zones is not None:
            match=[z for z in zones if z.get('name')=='mftintelligence.com']
            print('corporate_zone_found',len(match)==1)
            if len(match)==1:
              z=match[0]
              print('zone_owner_matches_known_account',(z.get('account') or {}).get('id')==account)
              m=get('corporate_mx','/zones/'+z['id']+'/dns_records?type=MX&name=mftintelligence.com&per_page=100')
              d=get('corporate_dmarc','/zones/'+z['id']+'/dns_records?type=TXT&name=_dmarc.mftintelligence.com&per_page=100')
              if m is not None:print('existing_corporate_mx_count',len(m))
              if d is not None:print('existing_dmarc_count',len(d))
          print('NO WRITES performed, secrets remained masked.')
          PY
