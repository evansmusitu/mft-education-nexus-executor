name: Product Frontier Android Qualification 20260913
on:
  pull_request:
    branches: [main]
    paths:
      - 'product_frontier_android_20260913/**'
      - '.github/workflows/product-frontier-android-qualification-20260913.yml'
permissions:
  contents: read
env:
  PARENT_V2_ZIP_SHA256: 14ba42284e284f902adef81e1049c021a67cb053c99db9db47b97d0b1706edb3
  PARENT_V2_MANIFEST_SHA256: 2f0d1f2c9724e9704bfe122c270412a49c5aebc63984d49e32850c6d56f4666c
  V4_MANIFEST_SHA256: 420a024390a4a9a94acaa4ff4ee169f6e800d13e03633215cd0db0e03035ca0c
  V4_SEALED_ZIP_SHA256: 921964b0fd8fb566b1f02faa9c59aa290dc61b6365532cac1cd58f8d4b6ef21e
  ANDROID_DIR: android_qualification_work/MFT_SOVEREIGN_INSTITUTION_ANDROID_FRONTIER_HARDENED_SOURCE
  PACKAGE_ID: com.musitu.sovereigninstitution
  LAUNCH_COMPONENT: com.musitu.sovereigninstitution/.MainActivity
  EXPO_PUBLIC_MUSITU_API_URL: https://institution.example.invalid
  NODE_ENV: production
  CI: '1'
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: product-frontier-android-20260913
      - name: Verify V2 parent and materialize sealed V4 payload
        shell: bash
        run: |
          set -euo pipefail
          cat product_frontier_android_20260913/sealed_v2.b64.{1,2,3,4} | base64 -d > /tmp/sealed-v2.zip
          echo "${PARENT_V2_ZIP_SHA256}  /tmp/sealed-v2.zip" | sha256sum -c -
          rm -rf android_qualification_work
          mkdir android_qualification_work
          unzip -q /tmp/sealed-v2.zip -d android_qualification_work
          cd "$ANDROID_DIR"
          echo "${PARENT_V2_MANIFEST_SHA256}  SHA256SUMS.txt" | sha256sum -c -
          sha256sum -c SHA256SUMS.txt
          cd "$GITHUB_WORKSPACE"
          python product_frontier_android_20260913/materialize_v4.py "$ANDROID_DIR"
          cd "$ANDROID_DIR"
          echo "${V4_MANIFEST_SHA256}  SHA256SUMS.txt" | sha256sum -c -
          sha256sum -c SHA256SUMS.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Resolve validate and prebuild V4 candidate
        shell: bash
        run: |
          set -euo pipefail
          cd "$ANDROID_DIR"
          npm install --no-audit --no-fund
          npx expo-doctor
          npx expo prebuild --platform android --clean --no-install
          grep -R 'usesCleartextTraffic="false"' android/app/src/main/AndroidManifest.xml
      - name: Build V4 release APK and AAB
        shell: bash
        run: |
          set -euo pipefail
          cd "$ANDROID_DIR/android"
          chmod +x gradlew
          ./gradlew --no-daemon clean lintRelease assembleRelease bundleRelease
      - name: Inspect V4 artifacts
        shell: bash
        run: |
          set -euo pipefail
          cd "$ANDROID_DIR"
          APK="$(find android/app/build/outputs/apk/release -name '*.apk' -type f | head -1)"
          AAB="$(find android/app/build/outputs/bundle/release -name '*.aab' -type f | head -1)"
          test -f "$APK"
          test -f "$AAB"
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BT/aapt" dump badging "$APK" | tee android_badging.txt
          grep "package: name='${PACKAGE_ID}'" android_badging.txt
          grep "versionCode='2'" android_badging.txt
          grep "targetSdkVersion:'36'" android_badging.txt
          grep "application-label:'MUSITU Sovereign Institution Intelligence'" android_badging.txt
          ! grep -q 'application-debuggable' android_badging.txt
          "$BT/apksigner" verify --verbose --print-certs "$APK" | tee apk_signing.txt
          sha256sum "$APK" "$AAB" | tee artifact_sha256.txt
          cp SHA256SUMS.txt qualified_source_sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: product-frontier-android-v4-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            android_qualification_work/MFT_SOVEREIGN_INSTITUTION_ANDROID_FRONTIER_HARDENED_SOURCE/android/app/build/outputs/apk/release/*.apk
            android_qualification_work/MFT_SOVEREIGN_INSTITUTION_ANDROID_FRONTIER_HARDENED_SOURCE/android/app/build/outputs/bundle/release/*.aab
            android_qualification_work/MFT_SOVEREIGN_INSTITUTION_ANDROID_FRONTIER_HARDENED_SOURCE/android_badging.txt
            android_qualification_work/MFT_SOVEREIGN_INSTITUTION_ANDROID_FRONTIER_HARDENED_SOURCE/apk_signing.txt
            android_qualification_work/MFT_SOVEREIGN_INSTITUTION_ANDROID_FRONTIER_HARDENED_SOURCE/artifact_sha256.txt
            android_qualification_work/MFT_SOVEREIGN_INSTITUTION_ANDROID_FRONTIER_HARDENED_SOURCE/qualified_source_sha256.txt
          if-no-files-found: error
          retention-days: 30

  emulator:
    name: api36-v4-release-apk-smoke
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: product-frontier-android-v4-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: emulator_input
      - name: Pin exact V4 APK hash from build evidence
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find emulator_input -name '*.apk' -type f | head -1)"
          test -f "$APK"
          EXPECTED="$(grep 'app-release.apk' emulator_input/artifact_sha256.txt | awk '{print $1}')"
          test -n "$EXPECTED"
          echo "$EXPECTED  $APK" | sha256sum -c -
          echo "APK=$APK" >> "$GITHUB_ENV"
          echo "APK_SHA256=$EXPECTED" >> "$GITHUB_ENV"
      - name: Enable KVM access
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Boot API-36 emulator install and launch exact V4 APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r "$APK" | tee emulator_install.txt
            adb logcat -c
            adb shell am start -W -n "$LAUNCH_COMPONENT" | tee emulator_start.txt
            sleep 12
            adb shell pidof "$PACKAGE_ID" | tr -d '\r' | tee emulator_pid.txt
            adb logcat -d -v threadtime | tee emulator_logcat.txt
            adb exec-out screencap -p > emulator_screen.png
            test -s emulator_pid.txt
            if grep -E 'FATAL EXCEPTION|Process: com\.musitu\.sovereigninstitution.*has died|AndroidRuntime.*FATAL' emulator_logcat.txt; then exit 41; fi
            printf 'EMULATOR_V4_LAUNCH_PASS\napk_sha256=%s\n' "$APK_SHA256" | tee emulator_smoke.txt
      - name: Upload V4 emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-frontier-android-v4-emulator-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            emulator_install.txt
            emulator_start.txt
            emulator_pid.txt
            emulator_logcat.txt
            emulator_screen.png
            emulator_smoke.txt
          if-no-files-found: warn
          retention-days: 30
